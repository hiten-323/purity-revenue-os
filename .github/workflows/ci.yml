# Unit suite for purity-revenue-os. Does not send mail, dial, or read secrets.
# Live integrity (SYSTEM_INTEGRITY=1) stays a laptop-only gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          SMART_OUTREACH_ENABLED: "0"
          AUTO_OUTREACH_ENABLED: "0"
          AI_CALLING_ENABLED: "0"
          SYSTEM_INTEGRITY: "0"
        run: python -m pytest -q --tb=short
