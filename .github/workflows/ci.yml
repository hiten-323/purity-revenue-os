# Unit suite for purity-revenue-os. Does not send mail, dial, or read secrets.
# Live integrity (SYSTEM_INTEGRITY=1) stays a laptop-only gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          SMART_OUTREACH_ENABLED: "0"
          AUTO_OUTREACH_ENABLED: "0"
          AI_CALLING_ENABLED: "0"
          SYSTEM_INTEGRITY: "0"
        run: python -m pytest -q --tb=short

  # Purity-owned files installed into the Nuraveda voice sidecar: dispatch
  # guard (volume caps, pause, wedge detection, credit/never-rang handling).
  # node:test only; stubs replace LiveKit and Prisma, nothing dials.
  voice-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nuraveda-voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: node --test test/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build


  # Exercise the production authority switch without starting a worker or
  # contacting any provider. This catches regressions where AUTO_OUTREACH_ENABLED
  # is wired to the wrong executor or a second outbound channel is armed.
  auto-authority:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify single-worker authority
        env:
          SMART_OUTREACH_ENABLED: "0"
          AUTO_OUTREACH_ENABLED: "1"
          AI_CALLING_ENABLED: "0"
          AISENSY_ENABLED: "0"
          SYSTEM_INTEGRITY: "0"
        run: |
          python -m pytest -q tests/test_production_config_defaults.py tests/test_calling_authority.py tests/test_business_hours_outbound_gate.py --tb=short
